name: frontend

on:
  push:
  pull_request:

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # the committed lock file: every run builds with the same versions (CodeRabbit)
      - run: npm ci --no-audit --no-fund
      - name: biome
        run: npm run lint
      - name: types
        run: npm run typecheck
      # the tests under coverage: a table on the run's summary page, the HTML report as a download
      - name: tests
        run: npm run coverage
      - name: coverage summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
            console.log(["## Page code coverage", "", "| | covered | |", "|---|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: page-coverage-report
          path: frontend/coverage
          if-no-files-found: ignore
      - name: build
        run: npm run build
