name: frontend

on:
  push:
  pull_request:

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the committed lock file: every run builds with the same versions (CodeRabbit)
      - run: npm ci --no-audit --no-fund
      - name: biome
        run: npm run lint
      - name: types
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: build
        run: npm run build
