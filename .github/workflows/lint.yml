name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github program tools tests
      - name: ruff format --check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check program tools tests
