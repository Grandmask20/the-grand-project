name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      # the offline tests; the others skip without the (not shipped) test screenshots,
      # and test_atlas_viewer needs a desktop and an atlas
      - name: tests
        shell: bash
        run: |
          set -e
          for t in test_atlas_builder test_atlas_io test_model_safety test_atlas_folder test_random_sequence test_drop_placement test_false_merge test_detect_pairs; do
            echo "===== $t"
            python -m "tests.$t"
          done
