name: Feature request
description: An idea for something new or better
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should the program do, and what would it help you with?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Screenshots of the atlas or a sketch help (what should be found, shown or marked).
