[project]
name = "the-grand-project"
version = "1.18"
description = "Builds one big map of your Path of Exile 2 atlas from screenshots: maps, paths, badges, towers and cities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "numpy",
    "pillow",
    "scipy",
    "scikit-learn",
    "skops",
]

[project.scripts]
grand-project = "grand_project.app.server:main"

[project.urls]
Repository = "https://github.com/Grandmask20/the-grand-project"
Homepage = "https://github.com/Grandmask20/the-grand-project"
Documentation = "https://github.com/Grandmask20/the-grand-project#readme"
"Bug Tracker" = "https://github.com/Grandmask20/the-grand-project/issues"
Changelog = "https://github.com/Grandmask20/the-grand-project/releases"

[project.optional-dependencies]
dev = [
    "coverage>=7.6",
    "pytest>=8",
    "ruff>=0.9",
]
training = [
    "datasets>=3.0",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=5.0",
]
annotator = [
    "streamlit>=1.53",
]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["grand_project*"]

[dependency-groups]
dev = [
    "coverage>=7.6",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` alone runs the offline tests and the ones with test data (skipped without it); the long ones are
# opt-in: pytest -m slow / pytest -m "" for everything
addopts = '-ra -m "not slow"'
markers = [
    "data: needs the test screenshots (Git LFS or ATLAS_TEST_DATA); skipped without them",
    "slow: takes several minutes",
]

# code coverage (make coverage; CI: every test job runs under it and one report is made from all of them)
[tool.coverage.run]
source = ["grand_project"]
parallel = true
# the app answers in threads; detection and the atlas-wide check run in worker processes
concurrency = ["thread", "multiprocessing"]
# stored relative, so runs on Windows, macOS and Linux combine into one report
relative_files = true
# the app under the browser tests is stopped with SIGTERM when it doesn't quit by itself
sigterm = true

[tool.coverage.paths]
source = ["grand_project/", "*/grand_project/", "*\\grand_project\\"]

[tool.coverage.report]
skip_empty = true
precision = 1
exclude_also = ['if __name__ == "__main__":']

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py311"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "W", "B", "SIM", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
